services:
  4kvm-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GATED_PIN=${NEXT_PUBLIC_GATED_PIN:-4kvm_alongLFB@2026}
        - NEXT_PUBLIC_GATED_LOCKED_TYPES=${NEXT_PUBLIC_GATED_LOCKED_TYPES:-伦理片}
        - NEXT_PUBLIC_GATED_LOCKED_TYPE_IDS=${NEXT_PUBLIC_GATED_LOCKED_TYPE_IDS:-5}
    container_name: 4kvm-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3028:3028"  # 仅限宿主机本地（Nginx）访问
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3028
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3028/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
