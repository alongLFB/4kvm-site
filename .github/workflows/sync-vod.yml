name: Sync Upstream VODs

on:
  schedule:
    # 每天北京时间中午 12:00 (UTC 04:00) 自动触发全量增量更新
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '抓取最近几小时更新的影视数据 (默认24小时)'
        required: false
        default: '24'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Run Upstream Sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/github/4kvm-site
            
            HOURS="${{ github.event.inputs.hours || 24 }}"
            echo "==> Triggering Upstream VOD Sync for last ${HOURS}h in Docker container..."
            
            docker exec -e SYNC_HOURS="${HOURS}" 4kvm-app node scripts/sync-upstream.mjs
            echo "==> Upstream VODs Synced Successfully into 4kvm.db!"
