name: Sync Upstream VODs

on:
  schedule:
    # 每天北京时间中午 12:00 (UTC 04:00) 自动触发全量增量更新
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '抓取最近几小时更新的影视数据 (默认24小时)'
        required: false
        default: '24'

permissions:
  contents: write

jobs:
  sync:
    name: Sync VODs & Commit Update Log
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Run Upstream Sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/github/4kvm-site
            
            # 暂存追更日志，同步拉取最新 scripts 目录代码
            [ -f scripts/UPDATE_LOG.md ] && cp scripts/UPDATE_LOG.md /tmp/UPDATE_LOG.md.bak 2>/dev/null || true
            git fetch origin master 2>/dev/null && git checkout origin/master -- scripts/ 2>/dev/null || true
            [ -f /tmp/UPDATE_LOG.md.bak ] && cp /tmp/UPDATE_LOG.md.bak scripts/UPDATE_LOG.md 2>/dev/null || true

            # 1. 确保数据目录与脚本目录存在且具有可写权限
            mkdir -p data scripts
            chmod -R 777 data scripts 2>/dev/null || true
            [ -f .env ] || touch .env
            # 自动纠正 .env 中可能存在的历史错误子域名 api.ikunzyapi.com -> ikunzyapi.com
            sed -i 's/api\.ikunzyapi\.com/ikunzyapi.com/g' .env 2>/dev/null || true
            [ -f scripts/UPDATE_LOG.md ] || touch scripts/UPDATE_LOG.md

            HOURS="${{ github.event.inputs.hours || 24 }}"
            echo "==> Triggering Upstream VOD Sync for last ${HOURS}h in Docker container..."

            # 2. 检查并确保 4kvm-app 处于运行状态（若未启动则自动拉起）
            if [ -z "$(docker compose ps -q 4kvm-app 2>/dev/null || true)" ] && ! docker ps --format '{{.Names}}' 2>/dev/null | grep -q "^4kvm-app$"; then
              echo "==> [Notice] 4kvm-app 容器未处于运行状态，正在启动..."
              docker compose up -d 4kvm-app || true
              sleep 3
            fi

            IKUN_URL="https://ikunzyapi.com/api.php/provide/vod/from/ikm3u8/at/json/"

            # 3. 执行同步逻辑（优先使用 docker compose exec，其次 docker exec，最后使用 docker compose run 兜底）
            if [ -n "$(docker compose ps -q 4kvm-app 2>/dev/null || true)" ]; then
              echo "==> 使用 docker compose exec 在运行中的 4kvm-app 容器内执行同步..."
              docker compose exec -T -e IKUN_API_BASE="$IKUN_URL" 4kvm-app node scripts/ingest-ikun-full.mjs --hours "${HOURS}"
            elif docker ps --format '{{.Names}}' 2>/dev/null | grep -q "^4kvm-app$"; then
              echo "==> 使用 docker exec 在 4kvm-app 容器内执行同步..."
              docker exec -e IKUN_API_BASE="$IKUN_URL" 4kvm-app node scripts/ingest-ikun-full.mjs --hours "${HOURS}"
            else
              echo "==> [Fallback] 容器未在后台运行，正在使用一次性容器执行增量同步..."
              docker compose run --rm -T -e IKUN_API_BASE="$IKUN_URL" 4kvm-app node scripts/ingest-ikun-full.mjs --hours "${HOURS}"
            fi

            echo "==> Upstream VODs Synced Successfully into 4kvm.db!"

      - name: Fetch UPDATE_LOG.md from Remote Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $SERVER_PORT -H $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -P $SERVER_PORT -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST:~/github/4kvm-site/scripts/UPDATE_LOG.md" ./scripts/UPDATE_LOG.md
          echo "==> Successfully fetched latest UPDATE_LOG.md from remote server."
          
          echo "=================================================="
          echo "📝 最新追更日志预览 (前 35 行):"
          echo "=================================================="
          head -n 35 ./scripts/UPDATE_LOG.md || true
          echo "=================================================="

      - name: Auto Commit & Push UPDATE_LOG.md to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/UPDATE_LOG.md
          if git diff --staged --quiet; then
            echo "==> No changes detected in UPDATE_LOG.md. Skipping commit."
          else
            git commit -m "docs(vod): auto update daily ingestion log [skip ci]"
            git push origin master
            echo "==> 🎉 Successfully committed and pushed latest UPDATE_LOG.md to GitHub!"
          fi
