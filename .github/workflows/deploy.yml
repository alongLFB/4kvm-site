name: Deploy to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Environment Secret
        id: env_prep
        env:
          RAW_ENV: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$RAW_ENV" ]; then
            B64=$(printf "%s" "$RAW_ENV" | base64 -w 0)
            echo "ENV_B64=$B64" >> "$GITHUB_OUTPUT"
            echo "HAS_ENV=1" >> "$GITHUB_OUTPUT"
          else
            echo "ENV_B64=" >> "$GITHUB_OUTPUT"
            echo "HAS_ENV=0" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_B64: ${{ steps.env_prep.outputs.ENV_B64 }}
          HAS_ENV: ${{ steps.env_prep.outputs.HAS_ENV }}
        with:
          host: ${{ secrets.SERVER_HOST }}     # 服务器IP
          username: ${{ secrets.SERVER_USER }} # 服务器用户名
          key: ${{ secrets.SERVER_SSH_KEY }}   # 服务器私钥
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: ENV_B64,HAS_ENV
          script: |
            set -euo pipefail
            mkdir -p ~/github
            cd ~/github
            
            if [ ! -d "4kvm-site" ]; then
              git clone https://github.com/alongLFB/4kvm-site.git
            fi
            cd 4kvm-site

            # 自动修复/配置远程 origin 地址，防止出现 'origin' does not appear to be a git repository 报错
            git remote add origin https://github.com/alongLFB/4kvm-site.git 2>/dev/null || git remote set-url origin https://github.com/alongLFB/4kvm-site.git
            
            git fetch origin master
            git reset --hard origin/master

            # 确保数据目录存在且具备持久化权限
            mkdir -p data

            # 如果在 GitHub Secrets 中配置了 ENV_FILE，则同步写入服务器 .env；否则保留服务器原有配置
            if [ "${HAS_ENV:-0}" = "1" ] && [ -n "${ENV_B64:-}" ]; then
              echo "==> Updating .env from GitHub Secrets..."
              echo "$ENV_B64" | base64 -d > .env
            else
              echo "==> No GitHub Secrets .env configured, keeping existing server .env..."
            fi

            # 停止可能存在的历史 PM2 进程（若有）
            if command -v pm2 &> /dev/null; then
              pm2 stop 4kvm-site 2>/dev/null || true
              pm2 delete 4kvm-site 2>/dev/null || true
            fi

            echo "==> Deploying with Docker Compose..."
            docker compose down 2>/dev/null || true
            docker compose up -d --build
            docker image prune -f

            echo "==> Verifying Deployment Health..."
            sleep 5
            curl -s http://127.0.0.1:3028/api/health || true
            echo "==> 4KVM Site Deployed Successfully!"
